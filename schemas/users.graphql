extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.9"
    import: ["@key", "@shareable"]
  )

"""
Requires a valid JWT. The field resolves to null when the caller is anonymous.
"""
directive @authenticated on FIELD_DEFINITION

"""
Requires a JWT whose role matches `role`.
"""
directive @requiresRole(role: Role!) on FIELD_DEFINITION

enum Role {
  USER
  ADMIN
}

type User @key(fields: "id") {
  id: ID!
  name: String!
  email: String @authenticated
  role: Role @requiresRole(role: ADMIN)
}

type UserEdge {
  cursor: String!
  node: User!
}

type PageInfo @shareable {
  hasNextPage: Boolean!
  endCursor: String
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type Query {
  user(id: ID!): User
  users(first: Int, after: String): UserConnection!
  me: User @authenticated
}
